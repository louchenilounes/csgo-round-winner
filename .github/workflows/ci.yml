name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          ruff check src app tests scripts
          ruff format --check src app tests scripts

      - name: Tests (pytest)
        run: python -m pytest

  docker:
    name: Image Docker et API
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Modèle de CI (données synthétiques)
        run: |
          pip install -r requirements-app.txt
          python scripts/make_ci_model.py

      - name: Construire l'image
        run: docker build -t csgo-round-winner .

      - name: Lancer l'API et l'interroger
        run: |
          docker run -d -p 8000:8000 --name api csgo-round-winner
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/predict \
               -H "Content-Type: application/json" \
               -d '{"map": "de_inferno", "time_left": 25, "bomb_planted": true, "t": {"players_alive": 3}, "ct": {"players_alive": 2}}'

      - name: Journaux du conteneur
        if: always()
        run: docker logs api || true
